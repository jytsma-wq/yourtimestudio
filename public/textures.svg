<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" aria-hidden="true">
  <defs>
    <filter id="linen-filter" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" />
    </filter>
    <filter id="paper-filter" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="turbulence" baseFrequency="0.5" numOctaves="2" stitchTiles="stitch" />
    </filter>
  </defs>
  <rect width="256" height="256" filter="url(#linen-filter)" />
</svg>
