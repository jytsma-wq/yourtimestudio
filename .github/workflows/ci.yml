name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: file:${{ github.workspace }}/prisma/ci.db
      NEXT_PUBLIC_SITE_URL: https://batumilighthouse.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=moderate

      - name: Build
        run: pnpm build

      - name: Apply disposable database migrations
        run: pnpm db:deploy

      - name: Smoke-test standalone production server
        run: |
          set -euo pipefail
          server_pid=""

          stop_server() {
            if [[ -n "$server_pid" ]]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
              server_pid=""
            fi
          }

          start_server() {
            local form_inbox_ready="$1"
            FORM_INBOX_READY="$form_inbox_ready" PORT=3100 node server.js > "$RUNNER_TEMP/batumi-lighthouse-server.log" 2>&1 &
            server_pid=$!

            local ready=false
            for attempt in {1..60}; do
              if curl --silent --fail http://127.0.0.1:3100/api > /dev/null; then
                ready=true
                break
              fi
              if ! kill -0 "$server_pid" 2>/dev/null; then
                cat "$RUNNER_TEMP/batumi-lighthouse-server.log"
                exit 1
              fi
              sleep 1
            done

            if [[ "$ready" != "true" ]]; then
              cat "$RUNNER_TEMP/batumi-lighthouse-server.log"
              exit 1
            fi
          }

          trap stop_server EXIT

          start_server false
          EXPECT_FORM_INBOX_READY=false SMOKE_BASE_URL=http://127.0.0.1:3100 node scripts/api-security-smoke.mjs
          stop_server

          start_server true
          SMOKE_BASE_URL=http://127.0.0.1:3100 node scripts/production-readiness-test.mjs
          SMOKE_BASE_URL=http://127.0.0.1:3100 node scripts/api-security-smoke.mjs
